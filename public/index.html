<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchBook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=La+Belle+Aurore&family=Playfair+Display:ital,wght@1,900&family=Abril+Fatface&family=Bebas+Neue&family=Lora:ital,wght@0,500;1,600&family=Special+Elite&display=swap">
<style>
:root{--g:#6bbd93;--b:#3b78b0;--p:#fff2da;--bg:#fff2da;--card:#fffaf0;--ink:#1d3248;--mute:#5a6978;--line:#e8d6b3;--tint:#fbe3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14222e;--card:#1c3040;--ink:#fff2da;--mute:#a9b8c4;--line:#2d4558;--tint:#3a2a35}}
:root[data-theme="dark"]{--bg:#14222e;--card:#1c3040;--ink:#fff2da;--mute:#a9b8c4;--line:#2d4558;--tint:#3a2a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0 0 6px;line-height:1.15}
h1{font-size:34px;font-weight:800}h2{font-size:24px}h3{font-size:19px}
a{color:var(--b)}
header{background:var(--b);color:#fff2da;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:italic 900 30px 'Playfair Display',Georgia,serif;letter-spacing:-.5px;color:#fff2da;text-decoration:none}.logo span{color:var(--g)}
header nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
header nav a{color:#fff2da;text-decoration:none;font-weight:600;padding:6px 10px;border-radius:8px;font-size:15px}
header nav a.on,header nav a:hover{background:rgba(255,242,218,.18)}
main{max-width:640px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:1px}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}.by{color:var(--mute);margin:2px 0 10px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--b);color:#fff;text-decoration:none;display:inline-block;text-align:center}
button.g{background:var(--g);color:#14222e}button.p{background:var(--p);color:#2a1418}
button.l{background:none;color:var(--b);padding:6px 4px;font-weight:600}
button.ob{background:var(--card);color:var(--b);border:2px solid var(--b);padding:8px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.fl{width:26px;height:34px;margin:0 2px;overflow:visible}.fl path{fill:none;stroke:var(--mute);stroke-width:2;stroke-linejoin:round}.fl path.m,.fl path.k{display:none}
.fl.on path{stroke:none}.fl.on path.m,.fl.on path.k{display:inline}
.fl.on path.o{fill:#6bbd93}.fl.on path.m{fill:#bfe3d0}.fl.on path.k{fill:#eef9f3}
.fl.on:nth-child(even) path.o{fill:#3b78b0}.fl.on:nth-child(even) path.m{fill:#86b2d8}.fl.on:nth-child(even) path.k{fill:#d9e8f5}
.dots.done .fl.on path.o{fill:#d62828}.dots.done .fl.on path.m{fill:#f26b21}.dots.done .fl.on path.k{fill:#ffd166}
.dots.done .fl.on:nth-child(even) path.o{fill:#f26b21}.dots.done .fl.on:nth-child(even) path.m{fill:#ff9a1f}.dots.done .fl.on:nth-child(even) path.k{fill:#ffe08a}
.dots{display:flex;align-items:center;margin:10px 0}.cities{color:var(--mute);font-size:14px;margin-left:6px}
.disc{background:var(--tint);border-left:5px solid var(--p);border-radius:10px;padding:12px 14px;font-weight:600;margin-bottom:10px}
.quote{background:var(--card);border:1px solid var(--g);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:Fraunces,Georgia,serif}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}.msg b{color:var(--b)}.msg small{color:var(--mute)}
.who{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:0;margin-bottom:14px;flex-wrap:nowrap;border-bottom:1px solid var(--line)}
.hot{background:#f26b21!important;color:#14222e!important}.ob.hot{border-color:#f26b21}.grey{background:#c9ced3!important;color:#5a6978!important;cursor:default}
.tb{background:none;color:var(--mute);border-radius:0;padding:8px 4px;margin:0;font-size:14px;line-height:1.25;white-space:normal;text-align:center;flex:1 1 0;border-bottom:3px solid transparent}.tb.on{color:var(--b);border-bottom-color:var(--b)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.mini .fl{width:21px;height:28px;margin:0 1px}
.qb{display:flex;align-items:center;gap:4px;padding:12px 6px}.qm{flex:1;min-height:160px;display:flex;align-items:center;justify-content:center}.qt{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.35}.qa2{color:var(--mute);font-size:13px;margin-top:8px}.qa{background:none;color:var(--b);line-height:0;padding:12px 8px;flex:0 0 auto}.qf{animation:qfade .4s}@keyframes qfade{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.qf{animation:none}}
.ctr{text-align:center}.ctr .dots{justify-content:center}
.ctr .row{justify-content:center}
.hero{padding:18px 4px 8px;text-align:center}.hero p{font-size:18px;max-width:34em;margin-left:auto;margin-right:auto}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.av{background:none;padding:3px;border:3px solid transparent;border-radius:50%;line-height:0}.av.sel{border-color:var(--b)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px}@media(max-width:480px){.shelf{grid-template-columns:repeat(2,1fr)}}
.gen{aspect-ratio:2/3;border-radius:6px;display:flex;flex-direction:column;justify-content:center;padding:8px;font-family:Fraunces,Georgia,serif;text-align:center;gap:6px;overflow:hidden;font-size:17px;line-height:1.1}.gen small{font-family:system-ui,sans-serif;font-size:12px}
.pick{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:4px;color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--g);color:#14222e;padding:12px 18px;border-radius:12px;font-weight:700;max-width:90%;z-index:9}
footer{max-width:640px;margin:0 auto;padding:6px 18px 30px;color:var(--mute);font-size:14px}footer a{margin-right:12px}
.note{border:1.5px dashed var(--mute);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mute);margin-bottom:14px}
ul.plain{padding-left:20px;margin:6px 0}
#script{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:0;padding:24px;font:34px/1.35 'La Belle Aurore',cursive;color:#fff2da;text-align:justify}#script span{display:inline-block;margin-right:.15em}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']) #script{opacity:.05}}
:root[data-theme='dark'] #script{opacity:.05}
</style></head>

<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
const FL=on=>`<svg class='fl${on?' on':''}' viewBox='0 0 40 52' aria-hidden='true'><path class='o' d='M20 2C23 9 27 12 29 17C30 14 31 11 31 9C36 15 38 22 36 30C34 41 27 48 20 48C12 48 5 41 5 32C5 24 10 20 13 14C14 18 16 19 18 19C17 13 17 8 20 2Z'/><path class='m' d='M20 21C23 26 28 30 28 37C28 43 24 46 20 46C16 46 12 43 12 37C12 32 15 30 17 25C18 27 19 28 20 28C20 25 20 23 20 21Z'/><path class='k' d='M20 33C22 36 25 38 24 42C24 44 22 45 20 45C18 45 16 44 16 42C16 38 19 37 20 33Z'/></svg>`;
const dots=(n,city)=>`<div class="dots ${n>=5?'done':''}" role="img" aria-label="${n} of 5 readers">${[0,1,2,3,4].map(i=>FL(i<n)).join('')}<span class="cities">${n>=5?'Board open, '+n+' readers in '+city:n+' of 5 readers in '+city}</span></div>`;
const GL=["<path d='M8 14q8-3 16 2 8-5 16-2v22q-8-3-16 2-8-5-16-2z'/>","<path d='M16 8h16v32l-8-7-8 7z'/>","<path d='M12 18h20v14q0 6-10 6t-10-6z'/>","<g fill='none' stroke-width='3'><circle cx='15' cy='28' r='7'/><circle cx='33' cy='28' r='7'/><path d='M22 27h4'/></g>","<path d='M9 33h30v5H9zM12 25h26v5H12zM8 17h28v5H8z'/>"];
const BG=['#6bbd93','#3b78b0','#fff2da','#cfeadb','#1d3248'];
const av=(i,s)=>{const k=(i/5|0),f=[2,3].includes(k)?'#1d3248':'#fff2da';return `<svg viewBox='0 0 48 48' width='${s}' height='${s}' role='img' aria-label='Placeholder profile picture ${i+1}'><circle cx='24' cy='24' r='24' fill='${BG[k%5]}'/><g fill='${f}' stroke='${f}'>${GL[i%5]}</g></svg>`};
const COV=[['#6bbd93','#14222e'],['#3b78b0','#fff2da'],['#fff2da','#2a1418'],['#1d3248','#fff2da']];
const cover=(t,a,i)=>`<div class='gen' role='img' aria-label='Cover of ${t}' style='background:${COV[i%4][0]};color:${COV[i%4][1]};border:1px solid var(--line)'><span>${t}</span><small>${a}</small></div>`;
const share=()=>`<div class='card'><h3>Share MatchBook</h3><p class='hint'>Know a reader who would like this? Send them the link.</p><div class='row' style='margin-top:8px'>${['Instagram','TikTok','Threads'].map(n=>`<button aria-label='Share on ${n}' title='Share on ${n}' onclick='toast("Demo: this will open ${n} sharing.")'><svg viewBox='0 0 24 24' width='22' height='22' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8'/></svg></button>`).join('')}</div><p class='hint'>Placeholder icons. The launch version uses each platform's official logo.</p></div>`;
const PR=["What made you pick up this book?","What makes this author unique?","Is there a moment of the book that stood out to you?","Which character stayed with you most?","What surprised you most?"];
const BOOKS=[["Piranesi","Susanna Clarke"],["Beloved","Toni Morrison"],["Dune","Frank Herbert"],["Circe","Madeline Miller"],["Educated","Tara Westover"],["The Power Broker","Robert Caro"],["Where the Crawdads Sing","Delia Owens"]];
const note=t=>`<div class='note'>${t}</div>`;
const bump=()=>{logsToday++;const e=$('#lc');if(e)e.textContent='Logged today: '+logsToday+' of 2'};
const BRD=[['Piranesi','Susanna Clarke','Atlanta',5,'2 days ago',1],['Where the Crawdads Sing','Delia Owens','Atlanta',14,'yesterday',3],['Circe','Madeline Miller','Los Angeles',8,'today',2]];
const EMPTY=`<div class='card ctr'><svg viewBox="0 0 160 110" width="170" role="img" aria-label="A matchbox with unlit matches" style="margin:6px auto 0;display:block"><rect x="38" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="40.5" cy="13" r="6" fill="#d62828"/><rect x="54" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="56.5" cy="13" r="6" fill="#d62828"/><rect x="70" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="72.5" cy="13" r="6" fill="#d62828"/><rect x="86" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="88.5" cy="13" r="6" fill="#d62828"/><rect x="102" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="104.5" cy="13" r="6" fill="#d62828"/><rect x="118" y="12" width="5" height="40" rx="2" fill="#e8c98e"/><circle cx="120.5" cy="13" r="6" fill="#d62828"/><rect x="20" y="42" width="120" height="52" rx="5" fill="#3b78b0"/><rect x="20" y="42" width="120" height="13" rx="5" fill="#1d3248"/><rect x="34" y="60" width="92" height="28" rx="3" fill="#fff2da"/><text x="80" y="79" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-style="italic" font-weight="900" font-size="17" fill="#3b78b0">Match<tspan fill="#6bbd93">Book</tspan></text></svg><h2 style='margin-top:10px'>Nothing’s sparked yet!</h2><p class='by'>Log books to match with other readers in your area.</p><button class='l' onclick='noBoards=false;render()'>Demo: show boards</button></div>`;
const LT=['My Bookshelf','What People are Reading','Books Logged'];
const MINE=[['Piranesi','Susanna Clarke','Atlanta',5,0,'Oct 20'],['Where the Crawdads Sing','Delia Owens','Atlanta',5,1,'Oct 14'],['Circe','Madeline Miller','Los Angeles',5,2,'Oct 9'],['Dune','Frank Herbert','Atlanta',4,null,'Oct 3'],['Educated','Tara Westover','Atlanta',3,null,'Sep 28'],['The Power Broker','Robert Caro','Atlanta',2,null,'Sep 20'],['Beloved','Toni Morrison','Atlanta',1,null,'Sep 12']];
const OTH=[['The Hobbit','J.R.R. Tolkien','Atlanta',4],['Braiding Sweetgrass','Robin Wall Kimmerer','Atlanta',3],['Tomorrow, and Tomorrow, and Tomorrow','Gabrielle Zevin','Atlanta',2],['Wolf Hall','Hilary Mantel','Atlanta',1]];
let logTab=0,shelf=['Piranesi','Beloved','Dune','Circe'];
const bcard=(b,btn)=>{const open=b[3]>=5;const inner=`<div class='card'><h3>${b[0]}</h3><p class='by' style='margin-bottom:2px'>${b[1]}</p><p class='cities' style='margin:0'>${open?'Board open':b[3]+' of 5 readers'}</p><div style='display:flex;justify-content:space-between;align-items:flex-end;gap:10px'><div class='dots ${open?'done':''}' style='margin:8px 0 0'>${[0,1,2,3,4].map(i=>FL(i<b[3])).join('')}</div><span class='cities' style='font-size:13px;white-space:nowrap;margin:0 0 4px'>${b[2]}</span></div>${btn||''}</div>`;return b[4]!=null?`<a href='#/board' onclick='cb=${b[4]}' style='text-decoration:none;color:inherit;display:block'>${inner}</a>`:inner};
const logPanel=()=>logTab==0?(MINE.some(b=>shelf.includes(b[0]))?`<div class='bgrid'>${MINE.filter(b=>shelf.includes(b[0])).map(tile).join('')}</div>`:"<div class='card'><p class='by' style='margin:0'>Your bookshelf is empty. Add books from Books Logged.</p></div>"):logTab==1?OTH.map(b=>bcard(b,"<button class='g' style='margin-top:8px' onclick='P.quick()'>I read this too</button>")).join(''):`<div class='card'>${MINE.map((b,i)=>`<div class='msg' style='display:flex;justify-content:space-between;gap:10px;align-items:center'><span><b>${b[0]}</b><br><small class='cities' style='margin:0'>${b[1]}. ${b[2]}, logged ${b[5]}</small></span><button class='ob${shelf.includes(b[0])?' hot':''}' style='padding:6px 10px;font-size:13px;flex:0 0 auto;max-width:42%' onclick='togShelf(${i})'>${shelf.includes(b[0])?'Remove from bookshelf':'Add to bookshelf'}</button></div>`).join('')}</div>`+QB();
const togShelf=i=>{const t=MINE[i][0],k=shelf.indexOf(t);if(k>=0)shelf.splice(k,1);else if(shelf.length>=8){toast('Your bookshelf holds up to 8 books. Remove one first.');return}else shelf.push(t);if($('#tabp'))setTab(logTab);else{const y=scrollY;render();scrollTo(0,y)}};
const tabBar=()=>LT.map((t,i)=>`<button class='tb${i==logTab?' on':''}' role='tab' aria-selected='${i==logTab}' onclick='setTab(${i})'>${t}</button>`).join('');
const setTab=i=>{logTab=i;$('#tbs').innerHTML=tabBar();$('#tabp').innerHTML=logPanel()};
const hs=t=>[...t].reduce((a,c)=>a+c.charCodeAt(0),0);
const TF=[['Abril Fatface,Georgia,serif',25,'normal'],['Bebas Neue,Impact,sans-serif',36,'normal'],['Playfair Display,Georgia,serif',25,'italic'],['Lora,Georgia,serif',25,'italic'],['Special Elite,Courier New,monospace',19,'normal'],['Fraunces,Georgia,serif',25,'normal']];
const AFT=['Lora,Georgia,serif','Special Elite,Courier New,monospace','Fraunces,Georgia,serif','La Belle Aurore,cursive','system-ui,sans-serif'];
const bookCover=(b,lg)=>{const h=hs(b[0]),t=TF[h%6],a=AFT[(h>>1)%5],c=COV[h%4];return `<div role='img' aria-label='Cover of ${b[0]}, by ${b[1]}' style='aspect-ratio:2/3;background:${c[0]};color:${c[1]};border:1px solid var(--line);border-radius:3px 8px 8px 3px;box-shadow:inset 9px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18px 12px 14px 22px;overflow:hidden${lg?';width:88%;margin:0 auto;position:relative':''}'><span style='font-family:${t[0]};font-size:${t[1]}px;font-style:${t[2]};line-height:1.05${lg?`;position:absolute;left:22px;right:12px;top:20%;text-align:center;font-size:${Math.round(t[1]*1.12*(b[0].length>16?.82:1))}px`:''}'>${b[0]}</span><span style='font-family:${a};font-size:${a.startsWith('La Belle')?17:13}px;line-height:1.1${lg?';position:absolute;left:22px;right:12px;bottom:14px;text-align:center':''}'>${b[1]}</span></div>`};
const tile=b=>{const h=hs(b[0]),t=TF[h%6],a=AFT[(h>>1)%5],c=COV[h%4],open=b[3]>=5;return `<div style='text-align:center'>${bookCover(b,1)}<div class='dots mini ${open?'done':''}' style='justify-content:center;margin:8px 0 6px'>${[0,1,2,3,4].map(i=>FL(i<b[3])).join('')}</div>${open&&b[4]!=null?`<a class='btn' style='background:var(--g);color:#14222e;padding:6px 14px;font-size:14px' href='#/board' onclick='cb=${b[4]}'>Board Open</a>`:`<span class='cities' style='margin:0;font-size:13px'>${b[3]} of 5 readers</span>`}<div class='cities' style='margin:4px 0 0;font-size:12px'>${b[2]}</div></div>`};
const QL=[["“Some books are to be tasted, others to be swallowed, and some few to be chewed and digested.”", "Francis Bacon, Of Studies (1625)"], ["“Read not to contradict and confute; nor to believe and take for granted; nor to find talk and discourse; but to weigh and consider.”", "Francis Bacon, Of Studies (1625)"], ["“Studies serve for delight, for ornament, and for ability.”", "Francis Bacon, Of Studies (1625)"], ["“A good book is the precious life-blood of a master spirit, embalmed and treasured up on purpose to a life beyond life.”", "John Milton, Areopagitica (1644)"], ["“What do you read, my lord?” “Words, words, words.”", "William Shakespeare, Hamlet"], ["“Reading furnishes the mind only with materials of knowledge; it is thinking makes what we read ours.”", "John Locke, Of the Conduct of the Understanding (1706)"], ["“Reading is to the mind what exercise is to the body.”", "Richard Steele, The Tatler (1710)"], ["“A man ought to read just as inclination leads him; for what he reads as a task will do him little good.”", "Samuel Johnson, in Boswell’s Life of Johnson (1791)"], ["“…I ascribe my early and invincible love of reading, which I would not exchange for the treasures of India.”", "Edward Gibbon, Memoirs of My Life and Writings (1796)"], ["“I cannot live without books.”", "Thomas Jefferson, letter to John Adams (1815)"], ["“Books are the best of things, well used; abused, among the worst.”", "Ralph Waldo Emerson, The American Scholar (1837)"], ["“The true University of these days is a Collection of Books.”", "Thomas Carlyle, On Heroes, Hero-Worship, and the Heroic in History (1841)"], ["“Books must be read as deliberately and reservedly as they were written.”", "Henry David Thoreau, Walden (1854)"], ["“How many a man has dated a new era in his life from the reading of a book!”", "Henry David Thoreau, Walden (1854)"], ["“Books are the treasured wealth of the world and the fit inheritance of generations and nations.”", "Henry David Thoreau, Walden (1854)"], ["“To read well, that is, to read true books in a true spirit, is a noble exercise.”", "Henry David Thoreau, Walden (1854)"], ["“They kept alive my fancy, and my hope of something beyond that place and time.”", "Charles Dickens, David Copperfield (1850)"], ["“And what is the use of a book,” thought Alice, “without pictures or conversations?”", "Lewis Carroll, Alice’s Adventures in Wonderland (1865)"], ["“There is no such thing as a moral or an immoral book. Books are well written, or badly written. That is all.”", "Oscar Wilde, Preface to The Picture of Dorian Gray (1891)"], ["“Only connect!”", "E. M. Forster, Howards End (1910)"], ["“Lock up your libraries if you like; but there is no gate, no lock, no bolt that you can set upon the freedom of my mind.”", "Virginia Woolf, A Room of One’s Own (1929)"]];
const QS=(a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a})(QL.slice());
let qi=0,qHold=false,qX=0,qTm;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qHtml=()=>`<div class='qf'><div class='qt'>${QS[qi][0]}</div><div class='qa2'>${QS[qi][1]}</div></div>`;
const QB=()=>`<div id='qb' class='card ctr qb' role='region' aria-roledescription='carousel' aria-label='Quotes about reading' onmouseenter='qHold=matchMedia("(hover:hover)").matches' onmouseleave='qHold=false' ontouchstart='qX=event.touches[0].clientX' ontouchend='qSw(event)'><button class='qa' aria-label='Previous quote' onclick='qGo(-1)'><svg viewBox='0 0 24 24' width='26' height='26' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M15 5l-7 7 7 7'/></svg></button><div id='qbt' class='qm'>${qHtml()}</div><button class='qa' aria-label='Next quote' onclick='qGo(1)'><svg viewBox='0 0 24 24' width='26' height='26' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M9 5l7 7-7 7'/></svg></button></div>`;
const qGo=d=>{qi=(qi+d+QS.length)%QS.length;const e=$('#qbt');if(e)e.innerHTML=qHtml();clearInterval(qTm);qTm=setInterval(qTick,30000)};
const qTick=()=>{if(!qHold&&!RM&&$('#qb'))qGo(1)};
const qSw=e=>{const dx=e.changedTouches[0].clientX-qX;if(Math.abs(dx)>40)qGo(dx<0?1:-1)};
qTm=setInterval(qTick,30000);
const heroDots=()=>dots(heroN,'Atlanta')+(heroN>=5?`<button class='p${heroOpened?' grey':''}' style='margin-bottom:10px' ${heroOpened?'disabled':''} onclick='heroOpen()'>Open the board</button>`:'');
const dl=(d,m)=>{const x=new Date();x.setDate(x.getDate()+d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const doc=(h,body)=>`<div class='card'><h2>${h}</h2>${body}</div>`;
let emailOn=true,noBoards=false,cb=0,heroOpened=false,logsToday=0,editP=false,reps=2,ans=false,heroN=2,picked='',sel=3;

const P={
'':o=>`<section class='hero'><h1 style='font-size:28px'>If you’ve ever put a book down and wondered, “Who can I talk to about this?!”, you’ve found the right place.</h1><p>When at least 5 readers in your city log the same book, a message board opens, and one day soon, a local bar, restaurant, or library may host each group to kindle conversation, ideas, and community.</p></section>
<div class='card ctr'><h2>Watch a book club catch fire!</h2><p class='by'>Where the Crawdads Sing: Atlanta</p><div id='hf'>${heroDots()}</div><div class='row'><button class='g' onclick='heroAdd()'>Add a reader</button><button class='ob' onclick='heroN=0;heroOpened=false;P.hf();$("#ca").classList.remove("hot")'>Restart</button></div><p class='hint'>A sample with pretend readers.</p></div>
${QB()}
<div class='card ctr'><h3>Starting in Atlanta</h3><p>Los Angeles and Philadelphia come next.<br>We value real-life, safe, in-person experiences.</p><div class='row' style='margin-top:10px'><a id='ca' class='btn${heroOpened?' hot':''}' href='#/signup'>Create account</a><button class='p' aria-expanded='${o?'true':'false'}' onclick='const h=$("#hw");h.hidden=!h.hidden;this.setAttribute("aria-expanded",!h.hidden)'>How it works</button></div><div id='hw' ${o?'':'hidden'} style='text-align:left;margin-top:14px;border-top:1px solid var(--line);padding-top:12px'><h3>How it works</h3><ul class='plain'><li><b>Log a book you finished.</b> Pick it from a verified catalog. Each log is stamped with your city, or the city you're visiting.</li><li><b>Watch five flames fill.</b> When 5 readers in your city have logged the same book, its board opens and the flames turn red and orange.</li><li><b>Answer one short prompt.</b> Up to 40 characters, then you can read everyone's first takes and join the chat.</li><li><b>We will eventually organize readers to meet in safe, public places.</b> Boards hold up to 20 readers. Messages expire after 7 days without a new one. Do NOT give out personal information over the app.</li></ul><p style='margin:10px 0 0'>For now, MatchBook does not organize or supervise in-person meetups. If you choose to meet other readers, please follow our <a href='#/guidelines'>Guidelines &amp; Safety</a>.</p></div></div>`,
how:()=>P[''](1),
partner:()=>`<div class='card'><h2>Partner with us</h2><p class='by'>Calling all bars, restaurants, libraries, and unique places: reach out to potentially be a host that matches with a MatchBook club once 5 readers in your neighborhood sign up. We’d love your help in building a local reading community!</p><label for='pn'>Venue name</label><input id='pn'><label for='pt'>Type</label><select id='pt'><option>Bar</option><option>Restaurant</option><option>Library</option><option>Other</option></select><label for='pc'>City</label><input id='pc'><label for='pe'>Contact email</label><input id='pe' type='email'><label for='pm'>Anything we should know?</label><textarea id='pm' rows='3'></textarea><div style='margin-top:12px'><button class='g' onclick='toast("Demo: nothing is sent yet.")'>Send</button></div></div>`,
guidelines:()=>doc('Community and safety guidelines',`${note('Draft wording for review.')}<ul class='plain'><li>Never share personal information on a board.</li><li>Meet only in safe, public places.</li><li>Be kind. Report anything that isn't, using "Report this message."</li><li>MatchBook never asks you to share your own social media accounts, and you shouldn't ask others to.</li><li>Moderators can remove messages and suspend accounts.</li><li>Proposed minimum age: 18+ (to be confirmed).</li></ul>`),
privacy:()=>doc('Privacy policy',`${note('Placeholder outline. Needs legal review before launch.')}<p>We collect as little as we can: your email (to verify your account), username, city, and the books you log. Passwords are stored hashed. We don't sell your data.</p>`),
terms:()=>doc('Terms of service',`${note('Placeholder outline. Needs legal review before launch.')}<p>One account per verified email. One log per book per account. Moderators may remove content or suspend accounts that break the community guidelines.</p><p><b>In-person meetups.</b> For now, MatchBook does not organize or supervise in-person meetups. Readers who choose to meet do so at their own discretion and should follow our <a href='#/guidelines'>Guidelines &amp; Safety</a>.</p>${note('For the lawyer: confirm this wording and any limits on MatchBook’s responsibility for meetups.')}`),
signup:()=>`<div class='card'><h2>Find your people through what you read</h2><label for='em'>Email</label><input id='em' type='email' autocomplete='email'><label for='un'>Username</label><input id='un' maxlength='24' placeholder='e.g. ahab_reads or dune_wanderer'><p class='hint'>3 to 24 characters. Work in a favorite book, author, genre or character. Usernames can’t be changed later.</p><label for='pw'>Password</label><input id='pw' type='password' autocomplete='new-password'><p class='hint'>At least 8 characters. Make it one you don't use anywhere else.</p><label for='ct'>Your city</label><select id='ct'><option>Atlanta</option><option>Los Angeles</option><option>Philadelphia</option></select><div style='margin-top:12px'><a class='btn' href='#/verify'>Create account</a></div><p class='hint'>Preview only. Nothing is sent or saved.</p></div>`,
verify:()=>`<div class='card'><h2>Check your email</h2><p class='by'>We sent a 6-digit code to your email. Enter it to finish creating your account.</p><label for='vc'>Verification code</label><input id='vc' inputmode='numeric' maxlength='6' autocomplete='one-time-code'><div class='row' style='margin-top:12px'><a class='btn' href='#/log'>Verify email</a><a class='btn' style='background:var(--card);color:var(--b);border:2px solid var(--b)' href='#/signup'>Use a different email</a></div></div>`,
log:()=>`<div class='card'><h2>Log a book, find your people</h2><label for='bq'>Search for your book</label><input id='bq' autocomplete='off' placeholder='Title or author' oninput='P.srch()'><div id='bl'></div><p class='hint' id='bs'></p><div class='row' style='margin-top:10px'><button class='g' onclick='P.logIt()'>Log it in Atlanta</button><button class='p' onclick='$("#tc").hidden=!$("#tc").hidden'>I'm travelling!</button></div><div id='tc' hidden style='margin-top:10px'><label for='tcs'>City you’re in</label><select id='tcs'><option>Choose the city you're in</option><option>Los Angeles</option><option>Philadelphia</option></select><label for='tcd'>Travelling until</label><input id='tcd' type='date' min='${dl(1,0)}' max='${dl(0,6)}'><p class='hint'>Pick a date up to 6 months from today.</p><label style='display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px'><input id='tch' type='checkbox' checked style='width:auto'>When the date is up, log my book in my home city</label><div style='margin-top:12px'><button class='g' onclick='P.logIt(1)'>Log it while travelling</button></div></div><p class='hint'>Can't find it? <a href='#/log' onclick='toast("Demo: this sends a missing-book request.");return false'>Request a missing book</a></p></div>
<div class='tabs' role='tablist' id='tbs' style='margin-top:20px'>${tabBar()}</div><div id='tabp'>${logPanel()}</div>${share()}`,
board:()=>{const B=BRD[cb];const top=`<div class='card' style='position:relative'><span class='cities' style='position:absolute;top:16px;right:16px;font-size:12px;margin:0'>${B[2]}</span><a class='btn' style='background:none;color:var(--b);padding:6px 4px' href='#/boards'>Back to Boards</a><h2>${B[0]}</h2><p class='by'>${B[1]}. ${B[3]} readers</p><div class='disc'>Remember never to share personal information over this app. All meetings should be in safe, public places.</div><div class='quote'>“It is really hard to be lonely very long in a world of words.”<small class='hint' style='display:block;margin-top:6px'>Naomi Shihab Nye, I'll Ask You Three Times, Are You OK?</small></div>`;
 if(!ans)return top+`<h3>Before you join the chat</h3><p class='by'>${PR[B[5]]}</p><label for='an'>Your answer</label><input id='an' maxlength='40' oninput='$("#cnt").textContent=this.value.length+"/40"'><p class='hint' id='cnt'>0/40</p><div style='margin-top:10px'><button onclick='P.join()'>Join the chat</button></div></div>`;
 return top+`<h3 style='font-size:17px'>Readers' first takes</h3>${[['tidewalker','The way it hides its own rules.'],['hall_of_statues','Quiet, strange, and kind.'],['you (sample)',$('#an')?.value||'Sample answer']].map(a=>`<div class='msg'><b>${a[0]}</b><div>${a[1]}</div></div>`).join('')}<p class='hint' style='margin:12px 0'>Messages expire after a week of inactivity. This board has 6 days left without a new message.</p>
 <div class='msg'><div class='who'>${av(7,28)}<b>tidewalker</b><small>2 days ago</small></div><div>Did anyone else reread the opening pages after the ending?</div>${reps?`<button class='l' onclick='P.rep(this)'>Report this message</button>`:''}</div>
 <div class='msg'><div class='who'>${av(12,28)}<b>hall_of_statues</b><small>Yesterday</small></div><div>Yes. It reads like a different book the second time.</div><button class='l' onclick='P.rep(this)'>Report this message</button></div>
 <label for='mt'>Your message</label><input id='mt' maxlength='400'><div style='margin-top:10px'><button onclick='toast("Demo: posting comes later.")'>Post message</button></div></div>`},
boards:()=>`<div class='card'><h2>Boards</h2>${noBoards?'':"<p class='by'>The boards you’re part of. Tap one to read and post.</p>"}</div>${noBoards?EMPTY:BRD.map((b,i)=>`<a href='#/board' onclick='cb=${i}' style='text-decoration:none;color:inherit;display:block'><div class='card'><h3>${b[0]}</h3><p class='by' style='margin-bottom:2px'>${b[1]}</p><p class='cities' style='margin:0'>${b[3]} readers, last message ${b[4]}</p><div style='display:flex;justify-content:space-between;align-items:flex-end;gap:10px'><div class='dots done' style='margin:8px 0 0'>${[0,1,2,3,4].map(()=>FL(1)).join('')}</div><span class='cities' style='font-size:13px;white-space:nowrap;margin:0 0 4px'>${b[2]}</span></div></div></a>`).join('')+`<button class='l' onclick='noBoards=true;render()'>Demo: show empty Boards</button>`}`,
profile:()=>{const who=`<div class='who' style='gap:14px'>${av(sel,72)}<div><h2 style='margin:0'>ahab_reads</h2><p class='by' style='margin:2px 0'>Atlanta, GA</p></div></div>`;const top=!editP?`<div class='card'><div style='display:flex;justify-content:space-between;align-items:flex-start;gap:10px'>${who}<button class='ob' style='padding:3px 10px;font-size:12px;flex:0 0 auto' onclick='editP=true;render()'>Edit profile</button></div></div>`:`<div class='card'><div style='display:flex;justify-content:space-between;align-items:flex-start;gap:10px'>${who}</div><div class='row' style='gap:8px;margin-top:14px'><button class='ob' onclick='$("#avp").hidden=!$("#avp").hidden'>Change picture</button><button class='ob' onclick='toast("Demo: city picker opens here.")'>Change city</button></div><div id='avp' hidden class='avgrid'>${Array.from({length:25},(_,i)=>`<button class='av ${i==sel?'sel':''}' aria-label='Picture ${i+1}' onclick='sel=${i};render()'>${av(i,44)}</button>`).join('')}</div><p class='hint'>Placeholder pictures. Our own art goes here.</p><label style='display:flex;gap:8px;align-items:center;font-weight:400;margin-top:16px'><input type='checkbox' ${emailOn?'checked':''} onchange='emailOn=this.checked;toast(emailOn?"Demo: room-opened emails are on.":"Demo: room-opened emails are off.")' style='width:auto'>Email me when one of my boards opens</label><p class='hint'>Every email also has a link to turn this off.</p><div style='margin-top:12px'><button class='g' onclick='editP=false;render()'>Done</button></div></div>`;return top+`
<div class='card'><h3>My bookshelf</h3><p class='by'>${shelf.length} of 8 books I want to discuss</p><div class='shelf'>${MINE.map((b,i)=>shelf.includes(b[0])?`<div style='text-align:center'>${bookCover(b)}<button class='l' onclick='togShelf(${i})'>Remove</button></div>`:'').join('')}</div></div>
<div class='card'><h3>Add from my logged books</h3>${MINE.map((b,i)=>shelf.includes(b[0])?'':`<div class='msg' style='display:flex;justify-content:space-between;gap:10px;align-items:center'><span>${b[0]}<br><small>${b[1]}, logged in ${b[2]}</small></span><button class='g' onclick='togShelf(${i})'>Add</button></div>`).join('')||"<p class='hint'>All your logged books are on your shelf.</p>"}</div>
<div class='card'><h3>Past Book Clubs</h3><div class='msg'><b>Piranesi: Atlanta</b> by Susanna Clarke<div class='cities' style='margin:0'>Discussed with tidewalker, hall_of_statues, sixteenth_niche</div></div></div>${QB()}${share()}`},
mod:()=>`<div class='card'><h2>Moderator review</h2><p class='by'>Moderator logins only. Sample reports below.</p></div>${[['kind_of_house','Check out my profile @everywhere for more!'],['the_other','This board is a waste of time.']].map(r=>`<div class='card'><p class='cities' style='margin:0 0 6px'>Board: Piranesi: Atlanta. Reported by hall_of_statues.</p><div class='msg'><b>${r[0]}</b><div>${r[1]}</div></div><div class='row' style='margin-top:10px'><button class='p' onclick='P.res(this,"Message removed.")'>Remove message</button><button class='p' onclick='P.res(this,"Message removed and user suspended.")'>Remove and suspend user</button><button class='g' onclick='P.res(this,"Report dismissed.")'>Dismiss report</button></div></div>`).join('')}`,
hf(){$('#hf').innerHTML=heroDots()},
heroAdd(){heroN=Math.min(heroN+1,5);P.hf();if(heroN==5)toast('Five readers. The board is open.')},
quick(){if(logsToday>=2){toast('Where’s the fire? You’ve reached today’s limit of 2 logs.');return}bump();toast('Demo: logged. 3 more readers to open the board.')},
srch(){const q=$('#bq').value.trim().toLowerCase(),L=$('#bl');picked='';$('#bs').textContent='';L.innerHTML=q.length<2?'':BOOKS.filter(b=>(b[0]+b[1]).toLowerCase().includes(q)).map(b=>`<button class='pick' onclick='P.choose("${b[0]}")'>${b[0]}, ${b[1]}</button>`).join('')||`<p class='hint'>No match in this sample list. The real app searches millions of books.</p>`},
choose(t){picked=t;$('#bq').value=t;$('#bl').innerHTML='';$('#bs').textContent='Selected: '+t},
logIt(tr){if(!picked){toast('Search for your book and choose it from the list.');return}if(logsToday>=2){toast('Where’s the fire? You’ve reached today’s limit of 2 logs.');return}if(tr){const d=$('#tcd').value,c=$('#tcs').value;if($('#tcs').selectedIndex<1||!d){toast('Choose the city you’re in and the date you’re travelling until.');return}bump();toast('Demo: logged in '+c+'. '+($('#tch').checked?'It will also be logged in Atlanta on '+d+'.':'It stays in '+c+' only.'));return}bump();toast('Demo: logged "'+picked+'". 4 more readers to open the board.')},
join(){if($('#an').value.trim().length<2){toast('Write a short answer to join the chat.');return}ans=true;render()},
rep(b){b.outerHTML="<small>Reported. A moderator will review it.</small>"},
res(b,m){b.closest('.card').remove();toast(m)}};
const heroAdd=P.heroAdd;const heroOpen=()=>{heroOpened=true;P.hf();const c=$('#ca');if(c)c.classList.add('hot')};
const PUB=[['how','How it works'],['partner','Partner with us']],APP=[['log','Log'],['boards','Boards'],['profile','Profile'],['mod','Moderator']];
const APPR=['signup','verify','log','boards','board','profile','mod'];
function render(){const r=(location.hash.replace(/^#\/?/,'')||'');const k=P[r]&&typeof P[r]()==='string'||r==='board'?r:'';const inApp=APPR.includes(k);
$('#nav').innerHTML=inApp?(['signup','verify'].includes(k)?'':APP.map(a=>`<a href='#/${a[0]}' class='${a[0]==k||(a[0]=='boards'&&k=='board')?'on':''}'>${a[1]}</a>`).join('')):PUB.map(a=>`<a href='#/${a[0]}' class='${a[0]==k?'on':''}'>${a[1]}</a>`).join('')+`<a href='#/signup' class='on'>Sign up</a>`;
$('#app').innerHTML=(inApp&&!['signup','verify'].includes(k)?`<p class='cities' style='margin:0 0 10px'>Atlanta, GA <svg viewBox='0 0 40 40' width='16' height='16' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linejoin='round' aria-hidden='true' style='vertical-align:-3px'><path d='M5 4H22L28 12L34 18L30 26L28 36H14L12 28L6 22Z'/></svg></p>`:'')+(k===''?P['']():P[k]());
$('#foot').innerHTML=`<a href='#/how'>How it works</a><a href='#/guidelines'>Guidelines &amp; Safety</a><a href='#/privacy'>Privacy</a><a href='#/terms'>Terms</a><br><span>Preview with sample data only. Nothing is saved.</span>`;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{ans=false;editP=false;render()});render();
(()=>{const sy=['an','the','wol','ver','ing','of','de','con','sti','tu','tion','ra','men','ble','or','pro','li','ber','ty','ha','se','mon'];let x=7,t='';const r=()=>(x=x*16807%2147483647)/2147483647;for(let i=0;i<900;i++){let w='';for(let j=0,n=1+(r()*3|0);j<n;j++)w+=sy[r()*sy.length|0];t+=`<span style='transform:rotate(${(r()*10-5).toFixed(1)}deg) translateY(${(r()*12-6).toFixed(0)}px);font-size:${(28+r()*18).toFixed(0)}px'>${w}</span> `}$('#script').innerHTML=t})();
</script></body></html>
